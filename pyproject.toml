[project]
name = "valstorm-cli"
version = "1.2.1"
description = "Valstorm Developer CLI"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "valstorm-mcp-server @ git+https://github.com/Valstorm-Corp/valstorm-mcp.git",
    "valstorm-client @ git+https://github.com/Valstorm-Corp/valstorm-client-python.git",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[project.scripts]
valstorm = "valstorm_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/valstorm_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "src/valstorm_cli/**/*.py",
]
